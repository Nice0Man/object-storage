name: Backend CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake ninja-build pkg-config \
          libsqlite3-dev libssl-dev uuid-dev zlib1g-dev

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg
          ${{ github.workspace }}/build/vcpkg_installed
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}-v2
        restore-keys: |
          ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}-
          ${{ runner.os }}-vcpkg-

    - name: Setup vcpkg
      run: |
        if [ ! -d "vcpkg" ]; then
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
        fi

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DBUILD_TESTING=ON \
          -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

    - name: Build
      run: cmake --build build --config Release -j$(nproc)

    - name: Run Unit Tests
      run: |
        cd build/tests
        ./unit_tests --gtest_output=xml:test-results-unit.xml
      continue-on-error: false

    - name: Run Integration Tests
      run: |
        cd build/tests
        if [ -f "./integration_tests" ]; then
          ./integration_tests --gtest_output=xml:test-results-integration.xml
        else
          echo "Integration tests not found, skipping..."
        fi
      continue-on-error: true

    - name: Test Summary
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f "build/tests/test-results-unit.xml" ]; then
          echo "✅ Unit tests completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Unit tests failed or not found" >> $GITHUB_STEP_SUMMARY
        fi
        if [ -f "build/tests/test-results-integration.xml" ]; then
          echo "✅ Integration tests completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️  Integration tests skipped" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: backend-build
        path: |
          build/console_server
        retention-days: 7
        if-no-files-found: warn

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          build/tests/test-results-*.xml
        retention-days: 7
        if-no-files-found: warn
