name: Backend CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          curl \
          zip \
          unzip \
          tar \
          git \
          libsqlite3-dev \
          libssl-dev \
          uuid-dev \
          zlib1g-dev

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 'a42af01b72c28a8e1d7b48107b33e4f286a55ef6'
        vcpkgJsonGlob: 'vcpkg.json'

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg
          ~/.cache/vcpkg
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Configure CMake
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DBUILD_TESTING=ON

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Run Unit Tests
      run: |
        cd build/tests
        ./unit_tests --gtest_output=xml:test-results-unit.xml
      continue-on-error: false

    - name: Run Integration Tests
      run: |
        cd build/tests
        if [ -f "./integration_tests" ]; then
          ./integration_tests --gtest_output=xml:test-results-integration.xml
        else
          echo "Integration tests not found, skipping..."
        fi
      continue-on-error: true

    - name: Test Summary
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f "build/tests/test-results-unit.xml" ]; then
          echo "✅ Unit tests completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Unit tests failed or not found" >> $GITHUB_STEP_SUMMARY
        fi
        if [ -f "build/tests/test-results-integration.xml" ]; then
          echo "✅ Integration tests completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️  Integration tests skipped" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: backend-build
        path: |
          build/console_server
          config.json
          drogon_config.json
        retention-days: 7
