# CMake-format configuration
---
# Format options
format:
  line_width: 100
  tab_size: 2
  use_tabchars: false
  max_subgroups_hwrap: 2
  max_pargs_hwrap: 6
  max_rows_cmdline: 2
  separate_ctrl_name_with_space: false
  separate_fn_name_with_space: false
  dangle_parens: false
  dangle_align: prefix
  min_prefix_chars: 4
  max_prefix_chars: 10
  max_lines_hwrap: 2
  line_ending: unix
  command_case: lower
  keyword_case: upper
  always_wrap: []
  enable_sort: true
  autosort: false

# Markup options
markup:
  bullet_char: '*'
  enum_char: .
  first_comment_is_literal: false
  literal_comment_pattern: null
  fence_pattern: ^\s*([`~]{3}[`~]*)(.*)$
  ruler_pattern: ^\s*[^\w\s]{3}.*[^\w\s]{3}$
  enable_markup: true

# Parse options
parse:
  additional_commands:
    vcpkg_install:
      pargs:
        nargs: '+'
        flags: []
      spelling: vcpkg_install
      kwargs: {}
    find_package:
      pargs:
        nargs: '+'
        flags: []
      spelling: find_package
      kwargs:
        REQUIRED: 0
        CONFIG: 0
        COMPONENTS: '+'

# Miscellaneous
misc:
  per_command: {}

